name: Build Persian IME Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          make
          
          echo "=== Build output ==="
          find build -maxdepth 6 -type f -print

      - name: Verify app executable
        run: |
          APP="build/Build/Products/Release/goftam.app"
          
          test -d "$APP"
          echo "App found: $APP"
          
          echo "=== App contents ==="
          find "$APP" -maxdepth 3 -type f -print
          
          echo "=== Executable ==="
          ls -lh "$APP/Contents/MacOS/"
          
          test -f "$APP/Contents/MacOS/goftam"

      - name: Package
        run: |
          mkdir -p demo
          cp -R build/Build/Products/Release/goftam.app \
            demo/Goftam-Persian-Demo.app

          ditto -c -k --sequesterRsrc --keepParent \
            demo/Goftam-Persian-Demo.app \
            demo/Goftam-Persian-Demo.zip

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: Goftam-Persian-Demo
          path: demo/Goftam-Persian-Demo.zip
