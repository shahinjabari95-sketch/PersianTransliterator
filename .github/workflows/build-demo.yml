name: Build Persian IME Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Goftam
        run: make

      - name: Show build files
        run: |
          find build -type f | head -100

      - name: Package Demo
        run: |
          mkdir -p demo
          cp -R build/Build/Products/Release/goftam.app demo/Goftam-Persian-Demo.app
          ditto -c -k --sequesterRsrc --keepParent \
            demo/Goftam-Persian-Demo.app \
            demo/Goftam-Persian-Demo.zip

      - name: Upload Demo
        uses: actions/upload-artifact@v4
        with:
          name: Goftam-Persian-Demo
          path: demo/Goftam-Persian-Demo.zip
